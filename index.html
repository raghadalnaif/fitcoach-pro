<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UR PASS — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#2626EC; --blue-d:#1E1EC7; --blue-l:#5252F1; --blue-bg:#EEF0FF;
  --text:#0F172A; --muted:#64748B; --border:#E5E7EB;
  --bg:#F8FAFC; --surface:#ffffff;
  --red:#EF4444; --green:#10B981;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 4px 24px rgba(38,38,236,.08);
  --shadow-lg:0 20px 60px rgba(38,38,236,.16);
  --font:'Tajawal',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
  direction:rtl;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%,rgba(38,38,236,.06) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 100% 100%,rgba(38,38,236,.04) 0%,transparent 60%),
    var(--bg)}

.login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:44px 36px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.logo-wrap{text-align:center;margin-bottom:36px}
.logo-mark{width:96px;height:96px;margin:0 auto 14px;display:block}
.logo-mark img{width:100%;height:100%;object-fit:contain;display:block}
.logo-tag{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;letter-spacing:2px;text-transform:uppercase}

.title{font-size:22px;font-weight:900;text-align:center;margin-bottom:8px}
.subtitle{font-size:14px;color:var(--muted);text-align:center;margin-bottom:32px}

.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
.form-input{width:100%;background:#F8FAFC;border:1.5px solid var(--border);border-radius:12px;
  padding:14px 16px;color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;
  outline:none;transition:all .2s;direction:ltr;text-align:right}
.form-input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(38,38,236,.08)}
.form-input::placeholder{color:#94A3B8;font-weight:400}

.btn-login{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:12px;
  font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;
  margin-top:8px;box-shadow:0 4px 16px rgba(38,38,236,.2)}
.btn-login:hover{background:var(--blue-d);transform:translateY(-1px);box-shadow:0 8px 24px rgba(38,38,236,.32)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

.error-box{background:#FEF2F2;border:1px solid #FECACA;color:var(--red);
  padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;
  display:none;text-align:right}
.error-box.show{display:block;animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.help-note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.7}

.admin-link{position:fixed;bottom:20px;left:20px;font-size:11px;color:#CBD5E1;text-decoration:none;font-weight:600;transition:color .2s}
.admin-link:hover{color:var(--blue)}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-wrap">
    <div class="logo-mark"><img src="/logo.png" alt="UR PASS"></div>
    <div class="logo-tag">Fitness &amp; Nutrition</div>
  </div>

  <div class="title">تسجيل الدخول</div>
  <div class="subtitle">أدخل بيانات الدخول التي زوّدك بها المدرب</div>

  <div class="error-box" id="errorBox"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label">اسم المستخدم</label>
      <input type="text" class="form-input" id="username" placeholder="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">كلمة المرور</label>
      <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">دخول</button>
  </form>

  <div class="help-note">نسيت بيانات الدخول؟ تواصل مع المدرب لإعادة إرسالها</div>
</div>

<a href="/admin" class="admin-link">لوحة المدرب</a>

<script>
const form = document.getElementById('loginForm');
const btn  = document.getElementById('btnLogin');
const err  = document.getElementById('errorBox');

if (localStorage.getItem('urpass_token')) location.href = '/app';

function showError(msg) {
  err.textContent = msg;
  err.classList.add('show');
  setTimeout(() => err.classList.remove('show'), 5000);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();

    if (!r.ok) {
      showError(data.expired ? (data.error + ' — ' + (data.message || '')) : (data.error || 'حدث خطأ'));
      btn.disabled = false;
      btn.textContent = 'دخول';
      return;
    }

    localStorage.setItem('urpass_token', data.token);
    localStorage.setItem('urpass_user', JSON.stringify(data.user));
    btn.textContent = 'تم — جاري التحويل...';
    setTimeout(() => location.href = '/app', 400);
  } catch {
    showError('تعذّر الاتصال بالخادم');
    btn.disabled = false;
    btn.textContent = 'دخول';
  }
});
</script>
</body>
</html>
